<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="tema.css"></head><body>
<!-- Capa 2: editorial em serifa (itálico na cor de destaque + romano branco). -->
<div class="slide dark" style="justify-content:flex-end;padding-bottom:110px">
  <div class="ph full-bleed" style="border:none;opacity:1;background:var(--ink);color:var(--muted-dark);font-size:30px;align-items:flex-start;padding-top:300px">FOTO: pessoa conhecida do nicho em fundo escuro, luz dura</div>
  <div class="shade"></div>
  <header class="top"><span>{{TAG}}</span><span>{{HANDLE}}</span><span>{{DATA}} ®</span></header>
  <div style="position:relative">
    <div class="handle-pill" style="margin-bottom:22px;font-size:28px"><span class="av" style="width:44px;height:44px"></span>{{HANDLE}}</div>
    <h1 class="serif-title"><em>Reprogramando o caixa:</em><br>Como as empresas estão voltando a lucrar com menos clientes?</h1>
  </div>
<div class="dots" data-i="{{I}}" data-n="{{N}}"></div></div><script>document.querySelectorAll(".dots").forEach(d=>{const n=+d.dataset.n||10,i=+d.dataset.i||1;d.innerHTML=Array.from({length:n},(_,k)=>`<i class="${k+1===i?"on":""}"></i>`).join("")})</script></body></html>
